[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 'app:create_app()' --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[deploy.variables]
DATABASE_URL = "${{Postgres-wkq1.DATABASE_URL}}"

[environments.production.variables]
PYTHON_VERSION = "3.11"